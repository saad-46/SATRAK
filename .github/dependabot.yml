version: 2
updates:
  # Python backend (apps/api)
  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-dev:
        patterns: ["pytest*", "ruff", "mypy", "bandit", "pip-audit", "import-linter"]
    labels: ["dependencies", "python"]

  # JS/TS workspace (root pnpm)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      js-dev:
        patterns: ["eslint*", "prettier*", "typescript", "turbo", "@types/*"]
    labels: ["dependencies", "javascript"]

  # GitHub Actions workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "ci"]
