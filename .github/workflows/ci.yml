name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Frontend (apps/web + TS packages)
  # ---------------------------------------------------------------------------
  web:
    name: Web (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version is the single source of truth in package.json
      # ("packageManager": "pnpm@9.15.9"); action-setup@v4 reads it. Do not also
      # pass a `version:` here — specifying both fails with "Multiple versions of
      # pnpm specified". action-setup runs before setup-node so `cache: pnpm` works.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Type-check
        run: pnpm run typecheck
      - name: Test
        run: pnpm run test
      - name: Build
        run: pnpm run build
        env:
          SKIP_ENV_VALIDATION: "true"
          NEXT_PUBLIC_API_URL: http://localhost:8000

  # ---------------------------------------------------------------------------
  # Backend quality (apps/api): lint · format · types · dependency rule · tests
  # ---------------------------------------------------------------------------
  api:
    name: API (lint · format · type · contracts · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .
      - name: Dependency lock is current
        run: |
          pip install pip-tools==7.6.2
          pip-compile --generate-hashes --quiet --strip-extras --output-file=requirements.lock pyproject.toml
          pip-compile --extra dev --generate-hashes --quiet --strip-extras --output-file=requirements-dev.lock pyproject.toml
          git diff --exit-code -- requirements.lock requirements-dev.lock
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format check)
        run: ruff format --check .
      - name: mypy (strict types)
        run: mypy app healthcheck.py
      - name: import-linter (dependency rule)
        run: lint-imports
      - name: Pytest (+ coverage gate)
        run: pytest --cov-report=xml
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Security: SAST (bandit), dependency CVEs (pip-audit), secret scan (gitleaks)
  # ---------------------------------------------------------------------------
  security:
    name: Security (bandit · pip-audit · gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans full history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock
      - name: Install security tools
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
      - name: Bandit (SAST)
        working-directory: apps/api
        run: bandit -q -c pyproject.toml -r app healthcheck.py
      - name: pip-audit (dependency CVEs)
        working-directory: apps/api
        run: pip-audit --require-hashes --disable-pip -r requirements-dev.lock
      - name: Gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Database migration validation against a real PostGIS instance
  # ---------------------------------------------------------------------------
  migrations:
    name: Migrations (alembic upgrade against PostGIS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: satrak
          POSTGRES_PASSWORD: satrak_ci
          POSTGRES_DB: satrak
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U satrak -d satrak"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .
      - name: Alembic upgrade head
        env:
          SATRAK_API_DATABASE_URL: postgresql+asyncpg://satrak:satrak_ci@localhost:5432/satrak
        run: alembic upgrade head
      - name: Alembic downgrade base (round-trip check)
        env:
          SATRAK_API_DATABASE_URL: postgresql+asyncpg://satrak:satrak_ci@localhost:5432/satrak
        run: alembic downgrade base

  # ---------------------------------------------------------------------------
  # Integration: roles + row-level security + real Redis rate limiting
  # ---------------------------------------------------------------------------
  integration:
    name: Integration (PostGIS roles/RLS · Redis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: satrak_ci_superuser
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: satrak_ci_superuser
      # Disposable CI-only credentials for a service container that is destroyed with the job.
      SATRAK_TEST_DATABASE_URL: postgresql+asyncpg://satrak_owner:satrak_ci_owner@localhost:5432/satrak_test
      SATRAK_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .
      - name: Provision roles and the test database
        run: |
          psql -v ON_ERROR_STOP=1 -f ../../infra/db/roles.sql
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE satrak_owner LOGIN CREATEDB NOSUPERUSER NOBYPASSRLS PASSWORD 'satrak_ci_owner';
          GRANT satrak_app, satrak_admin TO satrak_owner;
          CREATE DATABASE satrak_test OWNER satrak_owner;
          SQL
          psql -v ON_ERROR_STOP=1 -d satrak_test -c "CREATE EXTENSION IF NOT EXISTS postgis"
          # Migration 0001 also asks for postgis_topology, which only a superuser may create.
          psql -v ON_ERROR_STOP=1 -d satrak_test -c "CREATE EXTENSION IF NOT EXISTS postgis_topology"
      - name: Pytest with database and Redis (+ coverage gate)
        run: pytest --cov-report=xml
      - name: Fail if tests were skipped for a missing database, roles or Redis
        run: |
          pytest -q --no-cov -rs tests/db tests/core/test_ratelimit.py -p no:cacheprovider 2>&1 | tee skips.txt
          ! grep -Ei "SKIPPED.*(SATRAK_TEST|roles|redis)" skips.txt

  # ---------------------------------------------------------------------------
  # Docker build verification (does not push)
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker build verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: false
          tags: satrak-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: satrak-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Container smoke tests: run the built images with CI-only, synthetic configuration.
  # Proves the images start, answer probes and run as non-root, and that production
  # startup guards fire inside the image. It does NOT prove tenant isolation against a real
  # deployment, IdP-side revocation (R4) or network controls (R2/R3); see
  # docs/audit/PRODUCTION_SECURITY_EVIDENCE.md.
  # ---------------------------------------------------------------------------
  container-smoke:
    name: Container smoke tests
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: satrak_ci_superuser
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGUSER: postgres
      # Disposable CI-only credentials for service containers destroyed with the job.
      PGPASSWORD: satrak_ci_superuser
      MIGRATOR_URL: postgresql+asyncpg://satrak_migrator:ci_migrator_only@localhost:5432/satrak_smoke
      APP_URL: postgresql+asyncpg://satrak_app:ci_app_only@localhost:5432/satrak_smoke
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image (loaded into the local daemon)
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: false
          load: true
          tags: satrak-api:ci
          cache-from: type=gha
      - name: Provision roles and database (synthetic)
        run: |
          psql -v ON_ERROR_STOP=1 -f infra/db/roles.sql
          psql -v ON_ERROR_STOP=1 <<'SQL'
          ALTER ROLE satrak_migrator PASSWORD 'ci_migrator_only';
          ALTER ROLE satrak_app PASSWORD 'ci_app_only';
          CREATE DATABASE satrak_smoke OWNER satrak_migrator;
          SQL
          psql -v ON_ERROR_STOP=1 -d satrak_smoke -c "CREATE EXTENSION IF NOT EXISTS postgis" \
            -c "CREATE EXTENSION IF NOT EXISTS postgis_topology"
      - name: Migrate using the API image
        run: |
          docker run --rm --network host \
            -e SATRAK_API_MIGRATION_DATABASE_URL="$MIGRATOR_URL" \
            satrak-api:ci alembic upgrade head
      - name: API starts with production settings and synthetic config
        run: |
          # The issuer is deliberately unreachable (.invalid): startup must not need an IdP.
          docker run -d --name satrak-api --network host \
            -e SATRAK_API_ENVIRONMENT=production \
            -e SATRAK_API_DATABASE_URL="$APP_URL" \
            -e SATRAK_API_REDIS_URL=redis://localhost:6379/0 \
            -e SATRAK_API_AUTH_ISSUER=https://idp.invalid/realms/ci \
            -e SATRAK_API_AUTH_AUDIENCES=satrak-api-ci \
            -e 'SATRAK_API_CORS_ORIGINS=["https://app.invalid"]' \
            -e SATRAK_API_NETWORK_TOPOLOGY=behind_proxy \
            -e SATRAK_API_RATE_LIMIT_TRUSTED_PROXY_HOPS=1 \
            -e SATRAK_API_RATE_LIMIT_TRUSTED_PROXY_CIDRS=127.0.0.1/32 \
            satrak-api:ci
          for i in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/v1/health/live)" = 200 ] && break
            [ "$(docker inspect -f '{{.State.Running}}' satrak-api)" = true ] || break
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/v1/health/live)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/v1/health/ready)" = 200
      - name: API process is not root
        run: |
          uid="$(docker exec satrak-api id -u)"; user="$(docker exec satrak-api id -un)"
          echo "uid=$uid user=$user"
          test "$uid" != 0 && test "$user" = satrak
          test "$(docker inspect -f '{{.Config.User}}' satrak-api)" = satrak
          # Every process in the container, not only the entrypoint.
          ! docker top satrak-api -eo user | tail -n +2 | grep -qx root
      - name: Image HEALTHCHECK reports healthy
        run: |
          for i in $(seq 1 60); do
            s="$(docker inspect -f '{{.State.Health.Status}}' satrak-api)"
            [ "$s" = healthy ] && break
            sleep 3
          done
          echo "health=$s"; test "$s" = healthy
      - name: Health check script reports healthy, and unhealthy when unreachable
        run: |
          docker exec satrak-api python /app/healthcheck.py
          # Nothing listens on port 1: connection refused must exit non-zero.
          if docker exec satrak-api python /app/healthcheck.py http://127.0.0.1:1/api/v1/health/live; then
            echo "health check script passed against a closed port"; exit 1
          fi
          # A 404 from the live API is a non-success response and must also be unhealthy.
          if docker exec satrak-api python /app/healthcheck.py http://127.0.0.1:8000/api/v1/health/does-not-exist; then
            echo "health check script passed on a 404"; exit 1
          fi
      - name: API image has no development, spatial or curl packages
        run: |
          docker run --rm --entrypoint dpkg-query satrak-api:ci -W -f '${Package}\n' > api-packages.txt
          # Fail if the listing did not really run (an empty list would pass the grep below).
          test "$(wc -l < api-packages.txt)" -gt 20
          if bad="$(grep -E -e '-dev$' -e '^curl$' -e '^libcurl' -e '^libgdal' -e '^gdal-' -e '^libgeos' -e '^libmariadb' -e '^mariadb-' -e '^gnupg$' -e '^gpg$' -e '^linux-libc-dev$' api-packages.txt)"; then
            echo "unexpected packages in the API image:"; echo "$bad"; exit 1
          fi
          echo "packages inspected: $(wc -l < api-packages.txt)"
          docker exec satrak-api python -c "import geoalchemy2; print('geoalchemy2', geoalchemy2.__version__)"
      - name: Unsafe configuration is refused (exits non-zero)
        run: |
          # The schema owner as the application role would bypass row-level security.
          set +e
          out="$(docker run --rm --network host \
            -e SATRAK_API_ENVIRONMENT=production \
            -e SATRAK_API_DATABASE_URL="$MIGRATOR_URL" \
            -e SATRAK_API_REDIS_URL=redis://localhost:6379/0 \
            -e SATRAK_API_AUTH_ISSUER=https://idp.invalid/realms/ci \
            -e SATRAK_API_AUTH_AUDIENCES=satrak-api-ci \
            -e 'SATRAK_API_CORS_ORIGINS=["https://app.invalid"]' \
            -e SATRAK_API_NETWORK_TOPOLOGY=behind_proxy \
            -e SATRAK_API_RATE_LIMIT_TRUSTED_PROXY_HOPS=1 \
            -e SATRAK_API_RATE_LIMIT_TRUSTED_PROXY_CIDRS=127.0.0.1/32 \
            satrak-api:ci 2>&1)"; code=$?
          set -e
          echo "exit=$code"; echo "$out" | tail -n 5
          test "$code" != 0
          echo "$out" | grep -q "unsafe database role"
          # A production configuration with no database at all is also refused.
          set +e
          out="$(docker run --rm --network host \
            -e SATRAK_API_ENVIRONMENT=production \
            -e SATRAK_API_AUTH_ISSUER=https://idp.invalid/realms/ci \
            -e SATRAK_API_AUTH_AUDIENCES=satrak-api-ci \
            -e SATRAK_API_NETWORK_TOPOLOGY=behind_proxy \
            -e SATRAK_API_RATE_LIMIT_TRUSTED_PROXY_HOPS=1 \
            -e SATRAK_API_RATE_LIMIT_TRUSTED_PROXY_CIDRS=127.0.0.1/32 \
            satrak-api:ci 2>&1)"; code=$?
          set -e
          echo "exit=$code"; echo "$out" | tail -n 5
          test "$code" != 0
          echo "$out" | grep -q "database_url is required"
          # A production configuration that does not declare its network topology is refused.
          set +e
          out="$(docker run --rm --network host \
            -e SATRAK_API_ENVIRONMENT=production \
            -e SATRAK_API_DATABASE_URL="$APP_URL" \
            -e SATRAK_API_REDIS_URL=redis://localhost:6379/0 \
            -e SATRAK_API_AUTH_ISSUER=https://idp.invalid/realms/ci \
            -e SATRAK_API_AUTH_AUDIENCES=satrak-api-ci \
            -e 'SATRAK_API_CORS_ORIGINS=["https://app.invalid"]' \
            satrak-api:ci 2>&1)"; code=$?
          set -e
          echo "exit=$code"; echo "$out" | tail -n 5
          test "$code" != 0
          echo "$out" | grep -q "network_topology is required"
          # A wildcard proxy trust list is refused at start-up even if the command is overridden.
          set +e
          out="$(docker run --rm --network host -e FORWARDED_ALLOW_IPS='*' \
            -e SATRAK_API_ENVIRONMENT=production \
            -e SATRAK_API_DATABASE_URL="$APP_URL" \
            -e SATRAK_API_REDIS_URL=redis://localhost:6379/0 \
            -e SATRAK_API_AUTH_ISSUER=https://idp.invalid/realms/ci \
            -e SATRAK_API_AUTH_AUDIENCES=satrak-api-ci \
            -e 'SATRAK_API_CORS_ORIGINS=["https://app.invalid"]' \
            -e SATRAK_API_NETWORK_TOPOLOGY=behind_proxy \
            -e SATRAK_API_RATE_LIMIT_TRUSTED_PROXY_HOPS=1 \
            -e SATRAK_API_RATE_LIMIT_TRUSTED_PROXY_CIDRS=127.0.0.1/32 \
            satrak-api:ci 2>&1)"; code=$?
          set -e
          echo "exit=$code"; echo "$out" | tail -n 5
          test "$code" != 0
          echo "$out" | grep -q "FORWARDED_ALLOW_IPS is unsafe"
      - name: Build Web image (loaded into the local daemon)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: satrak-web:ci
          cache-from: type=gha
      - name: Web starts as non-root and serves /
        run: |
          docker run -d --name satrak-web -p 3000:3000 satrak-web:ci
          for i in $(seq 1 30); do
            code="$(curl -s -o web.html -w '%{http_code}' http://localhost:3000/ || true)"
            [ "$code" = 200 ] && break
            [ "$(docker inspect -f '{{.State.Running}}' satrak-web)" = true ] || break
            sleep 1
          done
          echo "status=$code"; test "$code" = 200
          grep -q SATRAK web.html
          uid="$(docker exec satrak-web id -u)"; user="$(docker exec satrak-web id -un)"
          echo "uid=$uid user=$user"
          test "$uid" != 0 && test "$user" = nextjs
          ! docker top satrak-web -eo user | tail -n +2 | grep -qx root
      - name: Web image ships the approved dependency versions
        run: |
          # Reads package.json of every installed copy inside the running image (no lock-file
          # shortcut), then compares with the approved floors and with pnpm-lock.yaml.
          docker exec -i satrak-web node - < scripts/ci/web_package_inventory.js > web-inventory.json || {
            echo "VERIFICATION INCOMPLETE: the inventory script failed"; cat web-inventory.json; exit 2
          }
          python3 scripts/ci/check_web_versions.py --inventory web-inventory.json --lock pnpm-lock.yaml
      - name: Container logs on failure
        if: failure()
        run: |
          docker logs satrak-api 2>&1 | tail -n 80 || true
          docker logs satrak-web 2>&1 | tail -n 40 || true

  # ---------------------------------------------------------------------------
  # Image vulnerability scan (Trivy). Trivy only scans; scripts/ci/image_scan_gate.py holds the
  # policy: fail on fixable HIGH/CRITICAL findings, honour documented unexpired exceptions
  # (security/image-scan-exceptions.json), and report any scanner problem as SCAN INCOMPLETE
  # (exit 2), which is never a pass. See docs/IMAGE_SCANNING.md.
  # ---------------------------------------------------------------------------
  image-scan:
    name: Image scan (${{ matrix.key }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: api
            context: apps/api
            file: apps/api/Dockerfile
            tag: satrak-api:ci
          - key: web
            context: .
            file: apps/web/Dockerfile
            tag: satrak-web:ci
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (loaded into the local daemon)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: ${{ matrix.tag }}
          cache-from: type=gha
      - name: Scan with Trivy (a failure here is reported by the gate as SCAN INCOMPLETE)
        id: trivy
        # Not an escape hatch: the gate step below runs always and fails unless this step succeeded.
        continue-on-error: true
        # Pinned to a full commit SHA: tags of this action were force-pushed in the March 2026
        # supply-chain incident. 57a97c7 is v0.35.0, listed by Aqua as unaffected; it installs
        # Trivy v0.69.3 (also listed as unaffected) via a SHA-pinned setup-trivy.
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ matrix.tag }}
          scanners: vuln
          severity: HIGH,CRITICAL
          format: json
          output: trivy-${{ matrix.key }}.json
          exit-code: "0"
          timeout: 10m
          version: v0.69.3
      - name: Convert to SARIF
        if: steps.trivy.outcome == 'success'
        run: |
          trivy convert --format sarif --output trivy-${{ matrix.key }}.sarif trivy-${{ matrix.key }}.json \
            || { echo "SCAN INCOMPLETE: SARIF conversion failed"; exit 2; }
          python3 scripts/ci/image_scan_gate.py sarif trivy-${{ matrix.key }}.sarif
      - name: Gate (fixable HIGH/CRITICAL, exceptions, scanner failure)
        if: always()
        run: |
          python3 scripts/ci/image_scan_gate.py gate \
            --report trivy-${{ matrix.key }}.json \
            --image-ref ${{ matrix.tag }} \
            --image-key ${{ matrix.key }} \
            --exceptions security/image-scan-exceptions.json \
            --trivy-outcome "${{ steps.trivy.outcome }}"
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.key }}
          path: |
            trivy-${{ matrix.key }}.json
            trivy-${{ matrix.key }}.sarif
          if-no-files-found: warn
          retention-days: 30
