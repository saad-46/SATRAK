[project]
name = "satrak-api"
version = "0.1.0"
description = "SATRAK API — FastAPI application gateway (engineering foundation)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "SATRAK Engineering" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "geoalchemy2>=0.16.0",
    "redis>=5.2.0",
    "structlog>=24.4.0",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "black>=24.10.0",
    "isort>=5.13.0",
    "mypy>=1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --- Ruff (linting) ----------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",  # FastAPI Depends() in defaults is idiomatic
    "N818",  # domain errors deliberately use DDD "...Violation" naming, not "...Error"
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# --- Black (formatting) ------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py312"]

# --- isort -------------------------------------------------------------------
[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app"]

# --- mypy (type checking) ----------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_decorators = false

# --- pytest ------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --cov=app --cov-report=term-missing"

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "alembic/*"]

[tool.coverage.report]
# A real gate, with headroom below the current ~84%. Abstract Protocol/interface
# bodies and TYPE_CHECKING blocks are excluded so interface-only ports (whose
# implementations land in later epics) don't unfairly depress the number.
fail_under = 80
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
    "@(abc\\.)?abstractmethod",
]
