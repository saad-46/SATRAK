[project]
name = "satrak-api"
version = "0.1.0"
description = "SATRAK API — FastAPI application gateway (engineering foundation)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "SATRAK Engineering" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "geoalchemy2>=0.16.0",
    "redis>=5.2.0",
    "structlog>=24.4.0",
    "orjson>=3.10.0",
    "PyJWT[crypto]>=2.10.0,<3",  # OIDC access-token validation (ADR-0013)
    "httpx>=0.28.0",            # OIDC discovery / JWKS fetch (also used by tests)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",         # single tool: lint + format + import-sort
    "mypy>=1.14.0",
    "bandit>=1.8.0",       # SAST
    "pip-audit>=2.7.0",    # dependency CVE audit
    "import-linter>=2.1",  # enforces the clean-architecture dependency rule
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --- Ruff (linting) ----------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",  # FastAPI Depends() in defaults is idiomatic
    "N818",  # domain errors deliberately use DDD "...Violation" naming, not "...Error"
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# --- Ruff (formatting) -------------------------------------------------------
# Ruff's formatter is black-compatible and Rust-based, so it is unaffected by the
# CPython 3.12.5 AST-safety bug that prevents black from running. It also sorts
# imports via the lint `I` rule, so ruff replaces both black and isort — one
# fast, future-proof toolchain. See ADR-0004.
[tool.ruff.format]
docstring-code-format = true

# --- mypy (type checking) ----------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_decorators = false

# --- pytest ------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing"
markers = [
    "integration: needs a real PostgreSQL/PostGIS (SATRAK_TEST_DATABASE_URL) and optionally Redis (SATRAK_TEST_REDIS_URL)",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "alembic/*"]

[tool.coverage.report]
# A real gate, with headroom below the current ~86%. Abstract Protocol/interface
# bodies and TYPE_CHECKING blocks are excluded so interface-only ports (whose
# implementations land in later epics) don't unfairly depress the number.
fail_under = 80
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
    "@(abc\\.)?abstractmethod",
]

# --- Bandit (SAST) -----------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", ".venv", "alembic"]

# --- import-linter (dependency-rule enforcement) -----------------------------
# Machine-enforces the Clean Architecture dependency rule that ADR-0002/0003
# describe: the shared kernel and bounded contexts must not depend outward.
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Shared kernel is framework- and app-agnostic"
type = "forbidden"
source_modules = ["app.shared"]
forbidden_modules = [
    "app.api",
    "app.db",
    "app.core",
    "app.contexts",
    "app.main",
    "app.testing",
]

[[tool.importlinter.contracts]]
name = "Bounded contexts depend only inward"
type = "forbidden"
source_modules = ["app.contexts"]
forbidden_modules = ["app.api", "app.db", "app.core", "app.main"]

# The bypass-capable (BYPASSRLS) database role is for audited maintenance only (ADR-0011).
[[tool.importlinter.contracts]]
name = "The web layer never uses privileged database access"
type = "forbidden"
source_modules = ["app.api", "app.contexts", "app.main"]
forbidden_modules = ["app.db.privileged"]

# The all-tenants repository scope is for system jobs, never request handling (ADR-0011).
[[tool.importlinter.contracts]]
name = "The web layer never uses the system-wide repository scope"
type = "forbidden"
source_modules = ["app.api", "app.main"]
forbidden_modules = ["app.shared.domain.system_scope"]

# No request path can start Earth Observation pipeline work today. A future endpoint that
# triggers it must first derive the caller's jurisdiction and put it in the task payload, so
# this contract is removed deliberately, in review, not by accident (ADR-0011).
[[tool.importlinter.contracts]]
name = "The web layer does not reach the pipeline services"
type = "forbidden"
source_modules = ["app.api", "app.main"]
forbidden_modules = [
    "app.contexts.earth_observation.application.acquisition",
    "app.contexts.earth_observation.application.ingestion",
    "app.contexts.earth_observation.application.metadata",
    "app.contexts.earth_observation.application.preprocessing",
    "app.contexts.earth_observation.application.tiling",
    "app.contexts.earth_observation.application.jobs",
]

[[tool.importlinter.contracts]]
name = "Core infrastructure does not depend on API or contexts"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.api", "app.contexts", "app.main"]

# Bounded contexts never import each other (ARCHITECTURE.md: "they collaborate via
# ids + domain events, not direct references"). This enforces that rule — including the
# ADR-0010 requirement that Earth Observation and Drone stay independent, communicating
# only through public interfaces and integration events. Add new contexts here as they
# are created.
# The Earth Observation domain layer stays pure: it may depend on the shared kernel
# and its own domain, but never on its application/infrastructure/interfaces layers
# (Clean Architecture — dependencies point inward). Locked in before the API layer is
# added so the boundary can't silently erode. Generalize to other contexts as they
# grow their own layered structure.
[[tool.importlinter.contracts]]
name = "Earth Observation domain layer stays pure"
type = "forbidden"
source_modules = ["app.contexts.earth_observation.domain"]
forbidden_modules = [
    "app.contexts.earth_observation.application",
    "app.contexts.earth_observation.infrastructure",
    "app.contexts.earth_observation.interfaces",
]

[[tool.importlinter.contracts]]
name = "Bounded contexts are mutually independent"
type = "independence"
modules = [
    "app.contexts.core",
    "app.contexts.identity",
    "app.contexts.organization",
    "app.contexts.earth_observation",
    "app.contexts.drone",
    "app.contexts.gis",
    "app.contexts.property",
    "app.contexts.permit",
    "app.contexts.inspection",
    "app.contexts.compliance",
    "app.contexts.analytics",
    "app.contexts.reporting",
    "app.contexts.administration",
    "app.contexts.notification",
]
