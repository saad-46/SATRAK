[project]
name = "satrak-py-geo"
version = "0.0.0"
description = "SATRAK shared geospatial support (CRS transform boundary) — scaffold, no implementation yet."
requires-python = ">=3.12"
readme = "README.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py_geo"]

[tool.pytest.ini_options]
pythonpath = ["src"]
